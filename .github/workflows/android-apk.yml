name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'outputs/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        working-directory: outputs
        run: pnpm install --frozen-lockfile

      - name: Copy website into native app
        working-directory: outputs
        run: pnpm copy:web

      - name: Generate Android project
        working-directory: outputs
        run: pnpm exec cap add android

      - name: Sync website and Capacitor plugins
        working-directory: outputs
        run: pnpm cap:sync

      - name: Build installable debug APK
        working-directory: outputs/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: mv outputs/android/app/build/outputs/apk/debug/app-debug.apk outputs/android/app/build/outputs/apk/debug/AL-TAAM-EATERY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-TAAM-EATERY-APK
          path: outputs/android/app/build/outputs/apk/debug/AL-TAAM-EATERY.apk
          if-no-files-found: error
          retention-days: 30
